name: 12 - Working with outputs

on:
  workflow_dispatch:
    inputs:
      build_status:
        description: "Choose build status"
        type: choice
        options:
          - success
          - failure
        default: success

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.build.outputs.status }}
    steps:
      - name: Print GITHUB_OUTPUT path
        run: echo "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: 
          echo "$GITHUB_OUTPUT"
          echo "status=${{ github.event.inputs.build_status }}" >> "$GITHUB_OUTPUT"
          echo "output1=value1" >> "$GITHUB_OUTPUT"
          echo "output2=value2" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          echo "mistake=true" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.build_status == 'success' }}
    steps:
      - name: Deploy
        run: echo "deploying"
      - name: Print Outputs
        run: 
          echo "Outputs 1: ${{ needs.build.outputs.output1 }}"