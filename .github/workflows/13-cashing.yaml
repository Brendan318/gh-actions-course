name: 13 - Using Cashing

on: 
  workflow_dispatch:
    inputs:
      use-cashe:
        description: Whether to execute cashe step 
        type: boolean
        default: true

jobs: 
  build:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: 13-caching/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with: 
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci 
      - name: testing
        run: npm run test
      - name: building
        run: npm run build 
      - name: Deploying to nonprod
        run: echo "Deploying to nonprod"
